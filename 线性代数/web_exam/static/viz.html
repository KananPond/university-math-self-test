<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩阵可视化实验台 · 线性代数考试模拟系统</title>
<link rel="stylesheet" href="style.css">
<style>
.viz-layout {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    gap: 18px;
    max-width: 1180px;
    margin: 18px auto;
    padding: 0 16px;
}

@media (max-width: 900px) {
    .viz-layout {
        grid-template-columns: 1fr;
    }
}

.viz-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.stat-list {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.stat-list th,
.stat-list td {
    border-bottom: 1px solid var(--line);
    padding: 7px 8px;
    text-align: left;
    vertical-align: top;
}

.stat-list th {
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
    width: 92px;
}

.viz-canvas-box {
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: #fafcff;
    padding: 10px;
    margin-top: 8px;
    overflow: auto;
}

.viz-canvas-box canvas {
    max-width: 100%;
}

.viz-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 6px 0 0;
}

.transform-box canvas {
    width: 100%;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--line);
}

.legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    flex-wrap: wrap;
}

.legend .chip {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: -1px;
}
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <h1>矩阵可视化实验台</h1>
        <p class="subtitle">输入任意矩阵 → 热力图 · 行列式 / 秩 / 逆 / 特征值 · 线性变换动画</p>
    </div>
    <div class="topbar-right">
        <a class="viz-link" href="index.html">返回考试页</a>
    </div>
</header>

<main class="viz-layout">
    <aside class="panel">
        <h2 class="panel-title">输入矩阵</h2>
        <div class="viz-toolbar">
            <button class="btn" id="btn-row-add" type="button">行 +</button>
            <button class="btn" id="btn-row-sub" type="button">行 −</button>
            <button class="btn" id="btn-col-add" type="button">列 +</button>
            <button class="btn" id="btn-col-sub" type="button">列 −</button>
            <button class="btn" id="btn-sample" type="button">示例</button>
        </div>
        <div id="editor"></div>
        <p class="viz-note">支持整数、小数与分数（如 3/2）；矩阵规模 1×1 ～ 4×4。</p>
    </aside>

    <section style="display:flex; flex-direction:column; gap:18px; min-width:0;">
        <section class="panel">
            <h2 class="panel-title">图形矩阵（热力图）与数值指标</h2>
            <div class="viz-canvas-box" id="heatmap"></div>
            <table class="stat-list" id="stats" style="margin-top:12px;"></table>
        </section>

        <section class="panel transform-box" id="transform-panel">
            <h2 class="panel-title">线性变换视角（2×2 矩阵）</h2>
            <canvas id="plane" width="640" height="420"></canvas>
            <div class="legend">
                <span><span class="chip" style="background:#93c5fd;"></span>原始坐标网格</span>
                <span><span class="chip" style="background:#fca5a5;"></span>变换后网格</span>
                <span><span class="chip" style="background:#16a34a;"></span>î、ĵ 与特征方向</span>
                <span><span class="chip" style="background:#f59e0b;"></span>单位正方形 → 平行四边形（面积 = |det|）</span>
            </div>
            <div class="viz-toolbar" style="margin-top:10px;">
                <button class="btn btn-primary" id="btn-animate" type="button">播放变换动画</button>
                <span class="viz-note" id="transform-note"></span>
            </div>
        </section>
    </section>
</main>

<script src="matrix.js"></script>
<script src="viz.js"></script>
</body>
</html>
